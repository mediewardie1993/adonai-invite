<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Adonai Prayer and Worship Night. Saturday, 7:30 PM, 2F CAI Sports Center, Caloocan City.">
<meta property="og:title" content="Adonai Prayer and Worship Night">
<meta property="og:description" content="Saturday, 7:30 PM. 2F CAI Sports Center, Caloocan City. Let&rsquo;s worship together!">
<meta property="og:image" content="https://mediewardie1993.github.io/adonai-invite/poster.jpg">
<title>Adonai Prayer and Worship Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  /* Layout: the fire film fades into the dark at every edge; the invitation rises below it on one centered axis, lit from the film's horizon flare. Single dark look by choice. */
  :root {
    color-scheme: dark;
    --night: #060403;
    --smoke: #1d1410;
    --linen: #f3e9da;
    --ash: #b3a08c;
    --ember: #f39a2e;
    --flame: #ffc46b;
    --display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
    --text: "EB Garamond", Garamond, Georgia, serif;
  }

  html { background: var(--night); }
  body {
    background: var(--night);
    color: var(--linen);
    font-family: var(--text);
    font-size: 1.125rem;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 0 56px;
  }

  .invite {
    max-width: 880px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .film {
    width: 100%;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: var(--night) url("poster.jpg") center / cover no-repeat;
    -webkit-mask-image: radial-gradient(ellipse 62% 68% at 50% 46%, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 62% 68% at 50% 46%, #000 55%, transparent 100%);
  }
  .film video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .words {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-top: -24px;
    position: relative;
  }

  .eyebrow {
    margin: 0;
    font-family: var(--display);
    font-size: 0.8125rem;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--ember);
  }

  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(2.1rem, 7.4vw, 4.25rem);
    line-height: 1.08;
    letter-spacing: 0.04em;
    text-wrap: balance;
    text-shadow: 0 0 42px rgba(243, 154, 46, 0.35);
  }
  h1 .and {
    font-family: var(--text);
    font-style: italic;
    font-weight: 400;
    font-size: 0.62em;
    letter-spacing: 0;
    color: var(--flame);
    padding-inline: 0.12em;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .call {
    margin: 0;
    font-style: italic;
    font-size: clamp(1.35rem, 4vw, 1.75rem);
    color: var(--flame);
  }

  .flare {
    width: min(100%, 520px);
    height: 1px;
    margin-block: 12px;
    background: linear-gradient(90deg, transparent, var(--ember) 50%, transparent);
    box-shadow: 0 0 18px 1px rgba(243, 154, 46, 0.55);
  }

  .details {
    margin: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 32px 56px;
    width: min(100%, 680px);
  }
  .details div {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  dt {
    font-family: var(--display);
    font-size: 0.75rem;
    letter-spacing: 0.36em;
    text-indent: 0.36em;
    text-transform: uppercase;
    color: var(--ash);
  }
  dd {
    margin: 0;
    font-size: 1.3rem;
    line-height: 1.35;
    text-wrap: balance;
  }
  dd strong {
    display: block;
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.6rem;
    letter-spacing: 0.05em;
  }
  dd span { color: var(--ash); }

  .directions {
    margin-top: 12px;
    padding: 14px 28px;
    border: 1px solid var(--ember);
    font-family: var(--display);
    font-size: 0.8125rem;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--linen);
    background: linear-gradient(180deg, transparent, var(--smoke));
    transition: background-color 0.25s, color 0.25s, box-shadow 0.25s;
  }
  .directions:hover {
    background: var(--ember);
    color: var(--night);
    box-shadow: 0 0 28px rgba(243, 154, 46, 0.45);
  }
  .directions:focus-visible {
    outline: 2px solid var(--flame);
    outline-offset: 4px;
  }

  .facebook {
    font-family: var(--display);
    font-size: 0.8125rem;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-transform: uppercase;
    color: var(--ash);
    text-decoration: underline;
    text-decoration-color: var(--ember);
    text-underline-offset: 6px;
    overflow-wrap: anywhere;
    transition: color 0.25s;
  }
  .facebook:hover { color: var(--flame); }
  .facebook:focus-visible {
    outline: 2px solid var(--flame);
    outline-offset: 4px;
  }

  @media (max-width: 560px) {
    /* Crop the film to a square so the tent and flame stay large on a phone. */
    .film {
      aspect-ratio: 1 / 1;
      background-size: auto 100%;
      -webkit-mask-image: radial-gradient(ellipse 78% 62% at 50% 46%, #000 55%, transparent 100%);
      mask-image: radial-gradient(ellipse 78% 62% at 50% 46%, #000 55%, transparent 100%);
    }
    .words { margin-top: -36px; }
    .details { grid-template-columns: minmax(0, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    .directions { transition: none; }
  }
</style>
</head>
<body>

<main class="invite">
  <div class="film">
    <video id="film" src="adonai.mp4" poster="poster.jpg" muted autoplay loop playsinline preload="auto" aria-label="The Adonai emblem, a tent with a flame inside, among rising embers"></video>
  </div>

  <div class="words">
    <p class="eyebrow">You are invited</p>
    <h1><span class="sr">Adonai </span>Prayer <span class="and">and</span> Worship Night</h1>
    <p class="call">Let&rsquo;s worship together!</p>

    <div class="flare" role="presentation"></div>

    <dl class="details">
      <div>
        <dt>When</dt>
        <dd><strong>Saturday</strong>7:30 PM</dd>
      </div>
      <div>
        <dt>Where</dt>
        <dd><strong>CAI Sports Center</strong>2nd Floor<br><span>Caloocan City, Philippines</span></dd>
      </div>
    </dl>

    <a class="directions" href="https://www.google.com/maps/search/?api=1&amp;query=CAI+Sports+Center+Caloocan+City" target="_blank" rel="noopener">Get directions</a>
    <a class="facebook" href="https://www.facebook.com/AdonaiJCCMCaloocan" target="_blank" rel="noopener">Follow Adonai on Facebook</a>
  </div>
</main>

<script>
  (function () {
    var film = document.getElementById("film");
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    function start() {
      if (!film.paused) return;
      var p = film.play();
      if (p && p.catch) p.catch(function () {});
    }
    start();
    film.addEventListener("canplay", start);
    window.addEventListener("pageshow", start);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) start();
    });
    ["touchstart", "click", "scroll"].forEach(function (name) {
      window.addEventListener(name, start, { passive: true });
    });
  })();
</script>
</body>
</html>
